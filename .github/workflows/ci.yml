name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  syntax:
    name: Syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.4
          sudo ln -sf /usr/bin/lua5.4 /usr/local/bin/lua
          sudo ln -sf /usr/bin/luac5.4 /usr/local/bin/luac
      - name: Lua + Shell + Python syntax
        run: bash config/awesome/scripts/check.sh --syntax "$PWD/config/awesome"

  test:
    name: Unit tests (busted)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua + LuaRocks
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.4 luarocks
      - name: Install busted
        run: luarocks install --local busted
      - name: Run tests
        run: bash config/awesome/tests/run_tests.sh
