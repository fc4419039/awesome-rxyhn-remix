name: Clone Tracker

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  track-clones:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch clone data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          data=$(gh api repos/${{ github.repository }}/traffic/clones)
          count=$(echo "$data" | jq '.count')
          uniques=$(echo "$data" | jq '.uniques')
          date=$(date -u +%Y-%m-%d)
          jq -n --argjson c "$count" --argjson u "$uniques" --arg d "$date" \
            '{count: $c, uniques: $u, updated: $d}' > stats/clones.json

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stats/clones.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "stats: actualizar contador de clones"
            git push
          fi
