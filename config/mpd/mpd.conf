# -----------------------------------------------------------------
# CONFIGURACIÓN CORREGIDA PARA MPD (AwesomeWM / rxyhn dotfiles)
# -----------------------------------------------------------------

# Rutas de Archivos y Directorios
music_directory     "~/Music"
playlist_directory  "~/.config/mpd/playlists"
db_file             "~/.config/mpd/database"
log_file            "~/.config/mpd/log"
pid_file            "~/.config/mpd/pid"
state_file          "~/.config/mpd/state"
sticker_file        "~/.config/mpd/sticker.sql"

# Conectividad
bind_to_address     "127.0.0.1"
port                "6600"
restore_paused      "yes"
max_output_buffer_size "16384"

# --- SALIDA DE AUDIO PRINCIPAL ---
# Compatible con PulseAudio y PipeWire sin bloquear el hardware del sistema.
audio_output {
    type            "pulse"
    name            "PipeWire Output" 
    buffer_time     "100000"
    mixer_type      "software"
}

# --- VISUALIZADOR FIFO (Requerido por los widgets de la barra) ---
# Genera el flujo de datos necesario para las barras de progreso animadas.
audio_output {
    type            "fifo"
    name            "my_fifo"
    format          "44100:16:2"
    path            "/tmp/mpd.fifo"
}
