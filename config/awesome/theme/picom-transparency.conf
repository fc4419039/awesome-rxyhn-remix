corner-radius = 8;
rounded-corners-exclude = [
  #"window_type = 'normal'",
  #"class_g = 'firefox'",
];

shadow = true
shadow-radius = 12
shadow-opacity = .75
shadow-offset-x = -12
shadow-offset-y = -12

shadow-exclude = [
    "class_g = 'firefox' && argb",
    "class_g = 'thunar'"
];

fading = true
fade-in-step = 0.02;
fade-out-step = 0.02;
fade-delta = 6

inactive-opacity = 1.0
active-opacity = 1.0
frame-opacity = 1.0

inactive-opacity-override = false;

opacity-rule =
[ "97:class_g = 'google-chrome'",
  "97:class_g = 'chromium'",
  "97:class_g = 'brave-browser'",
  "97:class_g = 'vlc'",
  "97:class_g = 'mpv'",
  "97:class_g = 'celluloid'",
  "97:class_g = 'thunar'",
  "97:class_g = 'nautilus'",
  "97:class_g = 'nemo'",
  "97:class_g = 'eog'",
  "97:class_g = 'ristretto'",
    ];

focus-exclude =
[ "class_g = 'Cairo-clock'",
   "class_g = 'firefox'",
   "class_g = 'ONLYOFFICE'",
   "class_g = 'Thunar'"
   ];

blur-background-exclude = [
    "window_type = 'desktop'",
    "_GTK_FRAME_EXTENTS@:c",
];

backend = "glx";
vsync = true

mark-wmwin-focused = true;
mark-ovredir-focused = true;
detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true
detect-client-leader = true
use-damage = false

log-level = "warn";

wintypes:
{
  tooltip = { fade = true; shadow = true; shadow-radius = 0; shadow-opacity = 1.0; shadow-offset-x = -20; shadow-offset-y = -20; full-shadow = true; };
  dnd = { shadow = false; }
  dropdown_menu = { shadow = false; };
  popup_menu    = { shadow = false; };
  utility       = { shadow = false; };
  dock = { opacity = 1.0; shadow = false;};
  dialog = { shadow = false;};
}
