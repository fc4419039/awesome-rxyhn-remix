corner-radius = 8;
rounded-corners-exclude = [
  #"window_type = 'normal'",
  #"class_g = 'firefox'",
];

shadow = true
shadow-radius = 12
shadow-opacity = .75
shadow-offset-x = -12
shadow-offset-y = -12

shadow-exclude = [
    "class_g = 'firefox' && argb",
    "class_g = 'thunar'"
];

fading = true
fade-in-step = 0.02;
fade-out-step = 0.02;
fade-delta = 6

inactive-opacity = 1.0
frame-opacity = 1.0

inactive-opacity-override = false;

focus-exclude =
[ "class_g = 'Cairo-clock'",
   "class_g = 'firefox'",
   "class_g = 'ONLYOFFICE'",
   "class_g = 'Thunar'"
   ];

opacity-rule =
[ "100:class_g = 'firefox'",
  "100:class_g = 'kitty'",
  "90:class_g = 'Spotify'",
  "100:class_g = 'music'",
  "100:class_g = 'ONLYOFFICE'",
  "100:class_g = 'Thunar'",
    ];

blur-method = "dual_kawase"
blur-size = 10
blur-strength = 6

blur-background = true
blur-background-frame = true

blur-background-exclude = [
    "window_type = 'desktop'",
    "_GTK_FRAME_EXTENTS@:c",
    "class_g = 'firefox'",
];

backend = "glx";
vsync = true

mark-wmwin-focused = true;
mark-ovredir-focused = true;
detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true
detect-client-leader = true
use-damage = false

log-level = "warn";

wintypes:
{
  tooltip = { fade = true; shadow = true; shadow-radius = 0; shadow-opacity = 1.0; shadow-offset-x = -20; shadow-offset-y = -20; full-shadow = true; };
  dnd = { shadow = false; }
  dropdown_menu = { shadow = false; };
  popup_menu    = { shadow = false; };
  utility       = { shadow = false; };
  dock = { shadow = false;};
  dialog = { shadow = false;};
}
